name: Finalize verified candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft or public prerelease tag to verify and publish without replacing assets
        type: string
        required: true
      validation_run_id:
        description: Successful Record independent release validation run containing evidence for this exact APK and commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: touch-release
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: release-validation
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Download existing candidate assets
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir dist
          gh release download "$RELEASE_TAG" --pattern touch.apk --pattern update.json --pattern SHA256SUMS.txt --dir dist
          python scripts/verify_release.py "$RELEASE_TAG" --allow-prerelease
      - name: Verify package, pinned certificate and manifest
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/touch.apk > "$RUNNER_TEMP/apk-signature.txt"
          grep -F "Signer #1 certificate SHA-256 digest: $(cat signing-certificate.sha256)" "$RUNNER_TEMP/apk-signature.txt"
          python scripts/check_downloaded_release.py --tag "$RELEASE_TAG" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt"
          if gh api repos/arcxya09/touch/releases/latest > "$RUNNER_TEMP/previous-release.json" 2> "$RUNNER_TEMP/release-query-error"; then
            PREVIOUS=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/previous-release.json"))["tag_name"])')
            gh release download "$PREVIOUS" --pattern update.json --dir "$RUNNER_TEMP/previous"
            python -c 'import json,os; assert json.load(open("dist/update.json"))["versionCode"] > json.load(open(os.environ["RUNNER_TEMP"]+"/previous/update.json"))["versionCode"]'
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/release-query-error"; then
            exit 1
          fi
      - name: Publish verified candidate as Latest
        run: |
          [[ "$VALIDATION_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID" > "$RUNNER_TEMP/validation-run.json"
          python -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/validation-run.json")); assert r["conclusion"] == "success" and r["event"] == "workflow_dispatch" and r["path"] == ".github/workflows/release-validation.yml", "Independent validation run is not successful or has the wrong workflow"'
          gh run download "$VALIDATION_RUN_ID" --name "release-validation-$RELEASE_TAG" --dir proof
          python ops/release_evidence.py --evidence proof/release-validation.json --manifest dist/update.json --apk dist/touch.apk --commit "$(git rev-parse HEAD)"
          TARGET_COMMIT=$(git rev-parse HEAD)
          export TARGET_COMMIT
          gh run list --workflow ci.yml --commit "$TARGET_COMMIT" --status success --json headSha,conclusion --limit 100 > "$RUNNER_TEMP/ci-runs.json"
          python -c 'import json,os; rows=json.load(open(os.environ["RUNNER_TEMP"]+"/ci-runs.json")); assert any(r["headSha"] == os.environ["TARGET_COMMIT"] and r["conclusion"] == "success" for r in rows), "The target commit has no successful full CI run"'
          gh release edit "$RELEASE_TAG" --prerelease=false --draft=false --latest
