name: Create version tag
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create, matching version.properties (e.g. v2.0.8)
        type: string
        required: true
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag the dispatched commit
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -qx "versionName=${TAG#v}" version.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Touch ${TAG#v}"
          git push origin "refs/tags/$TAG"
          echo "Tags pushed with GITHUB_TOKEN do not start the Release workflow; run Release with this tag."
