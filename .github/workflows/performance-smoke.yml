name: Emulator performance smoke (not device acceptance)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Synthetic scenes need no server, accounts or production endpoint.
      TOUCH_API_BASE: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-37.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare isolated emulator and evidence directory
        run: |
          chmod +x android/gradlew
          mkdir -p "$RUNNER_TEMP/performance-smoke"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Collect profiles and run emulator measurements
        id: measurements
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          # EMULATOR is suppressed only here. This workflow is not a release gate.
          script: |
            ./android/gradlew -p android :app:generateBaselineProfile -Pandroid.testInstrumentationRunnerArguments.class=com.arcxya09.touch.benchmark.BaselineProfiles -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR --stacktrace
            touch "$RUNNER_TEMP/performance-smoke/profile-completed"
            ./android/gradlew -p android :app:assembleBenchmark --stacktrace
            ./android/gradlew -p android :benchmark:connectedBenchmarkBenchmarkAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.arcxya09.touch.benchmark.StartupBenchmarks,com.arcxya09.touch.benchmark.ScrollBenchmarks -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR --stacktrace
            touch "$RUNNER_TEMP/performance-smoke/measurements-completed"
      - name: Describe evidence and reject missing measurement output
        if: always()
        env:
          MEASUREMENT_OUTCOME: ${{ steps.measurements.outcome }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'performance-smoke'
          output.mkdir(parents=True, exist_ok=True)
          additional = Path('android/benchmark/build/outputs/connected_android_test_additional_output')
          metrics = list(additional.rglob('*benchmarkData.json'))
          traces = list(additional.rglob('*.perfetto-trace'))
          profiles = list(Path('android/app/src/main/generated/baselineProfiles').glob('*-prof.txt'))
          apks = list(Path('android/app/build/outputs/apk/benchmark').glob('*.apk'))
          complete = os.environ['MEASUREMENT_OUTCOME'] == 'success'
          report = {
              'schemaVersion': 1, 'kind': 'emulator-performance-smoke', 'commit': os.environ['GITHUB_SHA'],
              'emulatorApi': 36, 'emulatorTarget': 'google_apis', 'emulatorArch': 'x86_64',
              'suppressedErrors': ['EMULATOR'], 'physicalDeviceAcceptance': False,
              'productionAccountsUsed': False, 'formalPerformanceGatePassed': False,
              'workflowStepOutcome': os.environ['MEASUREMENT_OUTCOME'],
              'profileCollectionCompleted': (output / 'profile-completed').exists(),
              'measurementsCompleted': (output / 'measurements-completed').exists(),
              'benchmarkJson': [str(path) for path in metrics], 'traces': [str(path) for path in traces],
              'profiles': [str(path) for path in profiles],
              'apkSha256': {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in apks},
          }
          (output / 'metadata.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          if complete:
              assert report['profileCollectionCompleted'] and report['measurementsCompleted'], 'Missing completion markers'
              assert metrics and traces and apks, 'Expected raw measurement JSON, traces and benchmark APK are missing'
              assert profiles and all(path.stat().st_size for path in profiles), 'Generated profiles are missing or empty'
          PY
          echo 'Emulator smoke only. EMULATOR checks were suppressed; no physical-device performance acceptance or release approval is implied. Compare raw measurements only under equivalent device and build conditions.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-performance-smoke-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/performance-smoke/
            android/app/src/main/generated/baselineProfiles/
            android/app/build/outputs/apk/benchmark/
            android/benchmark/build/outputs/androidTest-results/
            android/benchmark/build/reports/androidTests/
            android/benchmark/build/outputs/connected_android_test_additional_output/
