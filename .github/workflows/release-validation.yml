name: Record independent release validation
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public prerelease tag whose exact APK was tested
        required: true
        type: string
      evidence_json:
        description: Completed ops/release-evidence.example.json with links to actual device and published-upgrade results
        required: true
        type: string
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    environment: release-validation
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      EVIDENCE_JSON: ${{ inputs.evidence_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify exact prerelease and acceptance evidence
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          mkdir dist proof
          gh release download "$RELEASE_TAG" --pattern touch.apk --pattern update.json --pattern SHA256SUMS.txt --dir dist
          python scripts/verify_release.py "$RELEASE_TAG" --allow-prerelease
          python -c 'import os,pathlib; pathlib.Path("proof/release-validation.json").write_text(os.environ["EVIDENCE_JSON"], encoding="utf-8")'
          python ops/release_evidence.py --evidence proof/release-validation.json --manifest dist/update.json --apk dist/touch.apk --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ inputs.tag }}
          path: proof/release-validation.json
          if-no-files-found: error
          retention-days: 90
