name: Android device gate
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Android 37 uses the official 37.0 package name, not android-37.
        api: [29, 31, 33, 36, '37.0']
    env:
      TOUCH_API_BASE: http://127.0.0.1:8010
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: server/requirements-dev.txt}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-37.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare disposable local API
        run: |
          pip install -r server/requirements-dev.txt
          export TOUCH_TEST_DATA_DIR=$(mktemp -d "$RUNNER_TEMP/touch-device-XXXXXX")
          python server/tests/device_fixture.py > "$RUNNER_TEMP/device-api.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8010/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build isolated debug tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          # Explicit phone resources for API 37; other images retain their existing defaults.
          profile: ${{ matrix.api == '37.0' && 'pixel_2' || '' }}
          ram-size: ${{ matrix.api == '37.0' && '3072M' || '' }}
          heap-size: ${{ matrix.api == '37.0' && '576M' || '' }}
          disable-animations: true
          # Preserve guest diagnostics without changing the boot timeout or test gates.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
            ${{ matrix.api == '37.0' && '-show-kernel -verbose > /tmp/touch-emulator-boot.log 2>&1' || '' }}
          script: |
            adb reverse tcp:8010 tcp:8010
            ./android/gradlew -p android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.arcxya09.touch.PrivacyInstrumentedTest,com.arcxya09.touch.LocalStorageInstrumentedTest,com.arcxya09.touch.ReplyStorageTest,com.arcxya09.touch.LocalMessageActionsTest,com.arcxya09.touch.NotificationNavigationTest,com.arcxya09.touch.DataBoundaryTest,com.arcxya09.touch.VisibilityMigrationTest,com.arcxya09.touch.ExportRecoveryTest,com.arcxya09.touch.ViewModelConversationIsolationTest,com.arcxya09.touch.AttachmentDraftInstrumentedTest,com.arcxya09.touch.DesignSystemInstrumentedTest -Pandroid.testInstrumentationRunnerArguments.touchTestUser=verify_local_ci -Pandroid.testInstrumentationRunnerArguments.touchTestPassword=test-only-local-123 --stacktrace
      - name: Reject empty or skipped test runs
        run: python server/tests/check_device_results.py android/app/build/outputs/androidTest-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-gate-api-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/device-api.log
            /tmp/touch-emulator-boot.log
