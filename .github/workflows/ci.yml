name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: touch_test, POSTGRES_USER: touch, POSTGRES_PASSWORD: test_only}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U touch -d touch_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: server/requirements-dev.txt}
      - run: pip install -r server/requirements-dev.txt
      - run: ruff check server/app server/tests scripts
      - run: pytest -q
        working-directory: server
      - run: pytest -q
        working-directory: server
        env: {TEST_DATABASE_URL: "postgresql+psycopg://touch:test_only@localhost:5432/touch_test"}
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-37.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x android/gradlew
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: {name: touch-debug, path: android/app/build/outputs/apk/debug/*.apk}
