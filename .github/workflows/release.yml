name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: touch-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate tag and secrets
        env:
          KEYSTORE: ${{ secrets.TOUCH_KEYSTORE_BASE64 }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/touch-release.jks"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; inspect any previous draft rather than overwriting it.' >&2
            exit 1
          fi
      - name: Server checks
        run: |
          pip install -r server/requirements-dev.txt
          ruff check server/app server/tests scripts
          cd server
          pytest -q
      - name: Build and validate signed APK
        env:
          TOUCH_KEYSTORE: ${{ runner.temp }}/touch-release.jks
          TOUCH_STORE_PASSWORD: ${{ secrets.TOUCH_STORE_PASSWORD }}
          TOUCH_KEY_PASSWORD: ${{ secrets.TOUCH_KEY_PASSWORD }}
          TOUCH_KEY_ALIAS: touch
          TOUCH_API_BASE: https://chat.worldofmy.uk
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --stacktrace
          cd ..
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/touch.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/touch.apk
          python scripts/release_manifest.py --apk dist/touch.apk --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --tag "$RELEASE_TAG"
      - name: Enforce increasing version code
        run: |
          if gh api repos/arcxya09/touch/releases/latest > "$RUNNER_TEMP/previous-release.json" 2> "$RUNNER_TEMP/release-query-error"; then
            PREVIOUS=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/previous-release.json"))["tag_name"])')
            gh release download "$PREVIOUS" --pattern update.json --dir "$RUNNER_TEMP/previous"
            python -c 'import json,os; assert json.load(open("dist/update.json"))["versionCode"] > json.load(open(os.environ["RUNNER_TEMP"]+"/previous/update.json"))["versionCode"], "versionCode must increase"'
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/release-query-error"; then
            echo 'Could not verify previous release; refusing publication.' >&2
            exit 1
          fi
      - name: Upload draft, verify, then publish
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Touch番茄钟 $RELEASE_TAG" --notes-file CHANGELOG.md dist/touch.apk dist/update.json dist/SHA256SUMS.txt
          python scripts/verify_release.py "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/touch-release.jks"
