<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Touch · 管理工作台</title><style>
:root{color-scheme:light dark;--bg:#f4f2ec;--panel:#fdfcf8;--text:#223b32;--muted:#65756b;--line:#d8ded4;--brand:#315b46;--soft:#e8eee5;--danger:#993c34;--warn:#79571b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 "Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}main{max-width:1168px;padding:40px 32px 64px;margin:auto}a{color:var(--brand);text-underline-offset:4px}a:hover{text-decoration-thickness:2px}button,a,input,select,textarea{touch-action:manipulation}.masthead{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:40px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font:600 26px/1 Georgia,"Noto Serif SC",serif;letter-spacing:-1px;text-decoration:none;color:var(--text)}.brand-mark{display:inline-block;border:2px solid var(--brand);border-radius:50%;width:16px;height:16px;margin-right:10px;vertical-align:1px}.eyebrow{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:0 0 9px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:28px}h1{font:500 clamp(28px,4vw,38px)/1.3 "Noto Serif SC","Source Han Serif SC","Songti SC",serif;letter-spacing:-.5px;margin:0 0 12px}h2{font-size:19px;font-weight:600;margin:0 0 12px}p{margin:0 0 16px}.muted{color:var(--muted)}.small{font-size:12px}.card{padding:28px;border:1px solid var(--line);border-radius:16px;background:var(--panel);margin:24px 0}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:18px}.row,.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.form-grid .full{grid-column:1/-1}label{display:grid;align-content:start;gap:7px;font-size:13px;font-weight:500}input,button,select,textarea,.button{font:inherit;border-radius:9px;padding:11px 14px;min-height:44px;border:1px solid var(--line)}input,select,textarea{width:100%;min-width:0;background:var(--panel);color:var(--text)}input[type=checkbox]{width:20px;min-height:20px;accent-color:var(--brand)}.check{display:flex;align-items:center;gap:10px}textarea{resize:vertical}input::placeholder{color:var(--muted)}button{cursor:pointer;background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}button:hover{filter:brightness(1.1)}button.secondary,.button{background:transparent;color:var(--text);border-color:var(--line)}a.button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}.danger{background:var(--danger);border-color:var(--danger);color:#fff}.danger-link,.danger-text{color:var(--danger)}:focus-visible{outline:3px solid var(--brand);outline-offset:3px}.help{font-size:12px;color:var(--muted);margin:7px 0 0}.notice,.error{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:10px;padding:14px 18px;margin:18px 0;background:var(--soft)}.error{border-left-color:var(--danger);color:var(--danger);background:var(--panel)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{border-top:1px solid var(--line);padding:18px 0}.stat strong{display:block;font-size:25px;font-weight:500;font-variant-numeric:tabular-nums}.status{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;white-space:nowrap}.status.good{background:var(--soft)}.status.warn{color:var(--warn)}table{border-collapse:collapse;width:100%}th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:0 12px 12px}td{padding:20px 12px;border-top:1px solid var(--line);vertical-align:top}td:first-child,th:first-child{padding-left:0}td:last-child,th:last-child{padding-right:0}.person{display:flex;gap:12px;align-items:center}.avatar{width:40px;height:40px;flex:none;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:600}.person strong{display:block;font-weight:600}.person .small{overflow-wrap:anywhere}.account-actions{display:grid;gap:10px}.account-actions summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--brand)}.reset-form{max-width:260px;display:grid;gap:10px;padding:12px;background:var(--bg);border-radius:10px}.scroll{overflow-x:auto}.empty{padding:30px 0;color:var(--muted);text-align:center}.auth-layout{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;max-width:940px;margin:8vh auto}.auth-copy h1{font-size:44px;line-height:1.4;max-width:320px}.auth-copy .rule{width:48px;border-top:2px solid var(--brand);margin:26px 0}.login{max-width:480px;margin:32px auto}.auth-layout .login{width:100%;margin:0}.login label{margin:20px 0}.login input{width:100%}.stack{display:grid;gap:14px}.profile-form{max-width:620px}.profile-avatar{width:88px;height:88px;border-radius:24px}.footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.audit-time{font-variant-numeric:tabular-nums;white-space:nowrap}.operations{display:grid;grid-template-columns:1fr 1fr;gap:20px}.operations strong{display:block;font-size:14px;font-weight:500}
@media(max-width:760px){main{padding:24px 18px 40px}.masthead{margin-bottom:28px}header{display:block}header .actions{margin-top:20px}.card{padding:20px;margin:20px 0}.form-grid{grid-template-columns:1fr}.auth-layout{display:block;margin:0}.auth-copy{margin-bottom:28px}.auth-copy h1{font-size:30px;max-width:none}.auth-copy .rule{margin:18px 0}.auth-layout .login{max-width:none}.stats{gap:8px}.stat strong{font-size:22px}.accounts thead{display:none}.accounts,.accounts tbody,.accounts tr,.accounts td{display:block;width:100%}.accounts tr{padding:20px 0;border-top:1px solid var(--line)}.accounts td{border:0;padding:6px 0}.accounts tr:first-child{border:0;padding-top:0}.account-actions{margin-top:10px}.reset-form{max-width:none}.operations{grid-template-columns:1fr}.section-head{display:block}}
@media(prefers-color-scheme:dark){:root{--bg:#17231e;--panel:#1e2c25;--text:#e5ebe0;--muted:#a8b7a9;--line:#3b4e41;--brand:#8bbb96;--soft:#2a3d30;--danger:#f0a399;--warn:#dec58b}button{background:#42674d;color:#fff;border-color:#42674d}.danger{background:#793f39;border-color:#793f39;color:#fff}.secondary{color:var(--text)}}
@media(prefers-reduced-motion:no-preference){button,a.button{transition:background-color .15s,border-color .15s}}
</style></head><body><main><div class="masthead"><a class="brand" href="/admin"><span class="brand-mark" aria-hidden="true"></span>Touch</a><span class="eyebrow" style="margin:0">管理工作台</span></div>{% block content %}{% endblock %}<footer class="footer">Touch · 私密、专注、有序。</footer></main></body></html>
