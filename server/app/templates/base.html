<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Touch · 管理</title><style>
:root{color-scheme:light dark;--bg:#f7f5ef;--panel:#fff;--text:#262d29;--muted:#64736a;--line:#e2e7df;--brand:#396b4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}main{max-width:1140px;padding:36px 24px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:28px;letter-spacing:-1px;margin:0}h2{font-size:20px;margin-top:0}.muted{color:var(--muted)}.card{padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--panel);margin:24px 0}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:grid;gap:6px;font-size:14px}input,button,select{font:inherit;border-radius:10px;padding:10px 14px;border:1px solid var(--line)}input,select{max-width:100%;background:var(--bg);color:var(--text)}button{cursor:pointer;background:var(--brand);color:white}button.secondary{background:transparent;color:var(--text)}table{border-collapse:collapse;width:100%}td,th{padding:14px 10px;text-align:left;border-bottom:1px solid var(--line)}.scroll{overflow-x:auto}.small{font-size:13px}code{font-size:12px}.login{max-width:450px}.login label{margin:18px 0}.login input{width:100%}@media(prefers-color-scheme:dark){:root{--bg:#171e1a;--panel:#202a23;--text:#edf3ea;--muted:#acb9af;--line:#3b483e;--brand:#42754d}}
a.button{display:inline-block;text-decoration:none;font:inherit;border-radius:10px;padding:10px 14px;border:1px solid var(--line);color:var(--text)}a.danger-link,.danger-text{color:#b13b31}.danger{background:#ad302a;color:#fff}.account-actions{display:grid;gap:12px}input{box-sizing:border-box}@media(prefers-color-scheme:dark){a.danger-link,.danger-text{color:#ffaaa0}}
</style></head><body><main>{% block content %}{% endblock %}</main></body></html>
