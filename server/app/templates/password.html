{% extends "base.html" %}
{% block content %}
<div class="card login">
  <p class="muted small">TOUCH / ADMIN</p><h1>修改密码</h1>
  <p class="muted">首次登录须修改临时密码后才能管理账号。修改后其他登录会话将退出。</p>
  {% if error %}<p role="alert" class="danger-text">{{error}}</p>{% endif %}
  <form method="post" action="/admin/password">
    <input type="hidden" name="csrf" value="{{csrf}}">
    <label>当前密码<input type="password" name="current_password" required maxlength="128" autocomplete="current-password"></label>
    <label>新密码（至少 10 位）<input type="password" name="new_password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
    <label>再次输入新密码<input type="password" name="confirmation" required minlength="10" maxlength="128" autocomplete="new-password"></label>
    <button>保存新密码</button>
  </form>
  <form method="post" action="/admin/logout"><input type="hidden" name="csrf" value="{{csrf}}"><button class="secondary">退出登录</button></form>
</div>
{% endblock %}
