{% extends "base.html" %}{% block content %}
<div class="auth-layout"><section class="auth-copy"><p class="eyebrow">A quieter workspace</p><h1>把管理，<br>留在恰好的分寸。</h1><div class="rule"></div><p class="muted">在这里维护账号、资料与访问权限。<br>聊天内容始终不会出现在工作台。</p></section>
<section class="card login"><h2>管理员登录</h2><p class="muted small">使用管理员为你准备的账号。</p>{% if error %}<div class="error" role="alert">{{error}}</div>{% endif %}
<form method="post" action="/admin/login"><input type="hidden" name="csrf" value="{{csrf}}"><label>管理员账号<input name="username" value="{{username|default('')}}" required maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false"></label><label>密码<input type="password" name="password" required maxlength="128" autocomplete="current-password"></label><button style="width:100%">登录工作台</button></form></section></div>
{% endblock %}
