name: touch
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: touch
      POSTGRES_USER: touch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=25", "-c", "work_mem=2MB"]
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U touch -d touch"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 192m
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  app:
    build: ../server
    environment:
      DATABASE_URL: postgresql+psycopg://touch:${POSTGRES_PASSWORD}@db:5432/touch
      DATA_DIR: /data
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://chat.worldofmy.uk}
      SECURE_COOKIES: "true"
    ports:
      - "127.0.0.1:18080:8000"
    volumes:
      - files:/data
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
volumes:
  postgres:
  files:
